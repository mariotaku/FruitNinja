name: 'Fetch Fruit Ninja game assets'
description: >
  Downloads the original Bada Fruit Ninja asset dump from archive.org,
  extracts Data/, and verifies the game binary hash (anti-drift pin).

# ---------------------------------------------------------------------------
# Asset source (archive.org)
# ---------------------------------------------------------------------------
# Item  : https://archive.org/details/badaappsgamescollection
# File  : FruitNinja.zip  (20 MB, 971 files -- the largest/most complete copy)
# MD5   : 76844370f4c50b5f2bdc113b0664c4ce
# SHA1  : 8cc000f5843f60d445169a6e175cb0ab60905340
#
# Internal structure (VERIFY if the download changes):
#   FruitNinja.zip  (no .bar wrapper -- the package dirs are at the root)
#     Bin/  Data/  Info/  Res/  Share/  Signature*.xml  TrustShare/
#   Data/ is what we need; mount path /FruitNinjaBada/Data.
#   (The "Fruit Ninja.zip" / "Fruit Ninja(2).zip" copies DO wrap the package in
#    a .bar -- itself a zip. The extract step handles both .bar and no-.bar.)
#
# Pinned game version (anti-drift): the package's Bin/FruitNinja.exe is the game
# v1.6.1 binary. This action asserts its MD5 == expected-bin-md5 (input below),
# so if archive.org re-zips or swaps the build, the caller workflow fails loudly
# instead of silently shipping the wrong assets.
#   Bin/FruitNinja.exe  MD5 : ab60ff54a272abed1cbd403c5dcb7c55
#                       SHA1: a4669367a91c0e115b7dddfc127cebc00fee3089
#
# This action:
#   1. Downloads asset-filename from archive.org item asset-identifier
#   2. Unzips it to tmp-outer/ (a .bar inside, if any, is unzipped to tmp-inner/)
#   3. Asserts Bin/FruitNinja.exe MD5 == expected-bin-md5
#   4. Moves Data/ -> destination
#
# To use a different file, change the inputs' defaults below (or pass them
# from the calling workflow).
# ---------------------------------------------------------------------------

inputs:
  asset-identifier:
    description: 'archive.org item identifier'
    required: false
    default: 'badaappsgamescollection'
  asset-filename:
    description: >
      Asset zip filename within the item. "FruitNinja.zip" (no space) = the
      game v1.6.1 build (20 MB, the largest/most complete copy in the
      collection). The "Fruit Ninja.zip" (space) and "Fruit Ninja(2).zip"
      copies are EARLIER builds (1.5.x, reflowed fonts) -- do NOT use them for
      the 1.6.1 port. No space => no %20 encoding needed.
    required: false
    default: 'FruitNinja.zip'
  expected-bin-md5:
    description: >
      Anti-drift pin: asserted against the extracted Bin/FruitNinja.exe (game
      v1.6.1). If archive.org swaps the build, this action fails -- update
      this (and asset-filename / the header hashes above) only after
      confirming the new build is correct.
    required: false
    default: 'ab60ff54a272abed1cbd403c5dcb7c55'
  destination:
    description: 'Path (relative to the workspace) to move the extracted Data/ directory to'
    required: false
    default: 'FruitNinjaBada/Data'

runs:
  using: 'composite'
  steps:
    # ---- Cache the extracted Data/ ---------------------------------------
    # Skips the ~20 MB archive.org download + unzip + hash verify on a hit.
    # The key pins every input that determines the content (item, filename,
    # expected binary MD5), so bumping the asset pin busts the cache and the
    # download + anti-drift verify below run again. Both the web and webOS
    # jobs share this cache, since the key does not mention the workflow.
    - name: Restore cached game assets
      id: assets-cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.destination }}
        key: fn-assets-${{ inputs.asset-identifier }}-${{ inputs.asset-filename }}-${{ inputs.expected-bin-md5 }}

    - name: Report cache hit
      if: steps.assets-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "Game assets restored from cache: ${{ inputs.destination }}"
        echo "(archive.org download + binary hash verify skipped -- the cache"
        echo " key pins the asset identifier, filename and expected MD5.)"

    # ---- Download game assets from archive.org ---------------------------
    - name: Download Fruit Ninja assets from archive.org
      if: steps.assets-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        ASSET_FILENAME="${{ inputs.asset-filename }}"
        DOWNLOAD_URL="https://archive.org/download/${{ inputs.asset-identifier }}/${ASSET_FILENAME// /%20}"
        echo "Downloading: $DOWNLOAD_URL"
        curl -L --retry 5 --retry-delay 10 --fail \
             -o fruit-ninja-assets.zip \
             "$DOWNLOAD_URL"
        echo "Download complete. Size: $(wc -c < fruit-ninja-assets.zip) bytes"

    - name: Extract Data/ from Fruit Ninja asset archive
      if: steps.assets-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Composite-action steps run as `bash -eo pipefail`, whereas the plain
        # workflow `run:` steps this logic came from ran as `bash -e` (no
        # pipefail). Several `... | head -N` pipelines below make head exit
        # early, which SIGPIPEs the producer -- harmless before, but fatal
        # under pipefail. Restore the original semantics; real failures are
        # still caught by the explicit checks + `exit 1` below.
        set +o pipefail

        EXPECTED_BIN_MD5="${{ inputs.expected-bin-md5 }}"
        DESTINATION="${{ inputs.destination }}"

        mkdir -p tmp-outer tmp-inner "$(dirname "$DESTINATION")"

        # Step 1: unzip the outer archive (FruitNinja.zip)
        unzip -q fruit-ninja-assets.zip -d tmp-outer
        echo "=== Contents of outer archive ==="
        ls -la tmp-outer/

        # Step 2: find a .bar file (the Bada application package)
        BAR_FILE=$(find tmp-outer -maxdepth 2 -name "*.bar" | head -1)

        if [ -n "$BAR_FILE" ]; then
          echo "Found .bar: $BAR_FILE"
          # .bar is a zip -- unzip it
          unzip -q "$BAR_FILE" -d tmp-inner
          echo "=== Contents of .bar ==="
          ls -la tmp-inner/
          DATA_SRC="tmp-inner/Data"
        else
          echo "No .bar file found -- checking if Data/ is directly in outer archive"
          DATA_SRC="tmp-outer/Data"
        fi

        # Step 3: verify and move Data/
        if [ ! -d "$DATA_SRC" ]; then
          # Last resort: search anywhere in extracted tree
          DATA_SRC=$(find tmp-outer tmp-inner -maxdepth 4 -type d -name "Data" | head -1)
          echo "Searched for Data/ -- found: $DATA_SRC"
        fi

        if [ ! -d "$DATA_SRC" ]; then
          echo "ERROR: Could not locate Data/ directory in the downloaded archive."
          echo "Archive structure:"
          find tmp-outer tmp-inner -maxdepth 4 | sort
          exit 1
        fi

        # Step 3.5: ASSERT the game binary hash (anti-drift version pin).
        # Bin/ sits beside Data/ (both under tmp-inner if a .bar was found,
        # else tmp-outer). If archive.org swaps the build, fail loudly.
        BIN_SRC="$(dirname "$DATA_SRC")/Bin/FruitNinja.exe"
        if [ ! -f "$BIN_SRC" ]; then
          BIN_SRC=$(find tmp-outer tmp-inner -maxdepth 4 -type f -name "FruitNinja.exe" | head -1)
        fi
        if [ ! -f "$BIN_SRC" ]; then
          echo "ERROR: could not find Bin/FruitNinja.exe to verify the binary hash."
          exit 1
        fi
        ACTUAL_BIN_MD5=$(md5sum "$BIN_SRC" | cut -d' ' -f1)
        echo "Binary: $BIN_SRC  MD5: $ACTUAL_BIN_MD5"
        if [ "$ACTUAL_BIN_MD5" != "$EXPECTED_BIN_MD5" ]; then
          echo "ERROR: game binary hash drift -- archive.org asset changed."
          echo "  expected $EXPECTED_BIN_MD5 (game v1.6.1)"
          echo "  got      $ACTUAL_BIN_MD5"
          exit 1
        fi
        echo "Binary hash OK (game v1.6.1)."

        mv "$DATA_SRC" "$DESTINATION"
        echo "=== $DESTINATION ready ==="
        find "$DESTINATION" -maxdepth 2 | sort | head -40

        # Cleanup
        rm -rf tmp-outer tmp-inner fruit-ninja-assets.zip
