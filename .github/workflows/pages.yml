name: Pages

# Manual deploy only -- the maintainer controls cadence.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # First, so every later step (CMake's Python3_EXECUTABLE, build_pages.py,
      # build-gallery.sh) uses this one interpreter. Unlike /usr/bin/python3 it
      # is not PEP 668 externally-managed, so pip works -- hence pip, not apt,
      # for the python modules below.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # resvg-py self-provisions via `pip install --target` in svg-to-webp.py.
      - name: Install Python build deps
        run: python -m pip install --disable-pip-version-check Pillow fonttools

      # EMSDK_VERSION lives in tools/web/config.sh, shared with rebuild-web.sh.
      - name: Load pinned emsdk version
        run: |
          . tools/web/config.sh
          echo "EMSDK_VERSION=$EMSDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up emsdk ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg

      # Source documented in .github/actions/fetch-game-assets/action.yml.
      - name: Fetch game assets
        uses: ./.github/actions/fetch-game-assets

      # Same entrypoint as local dev (tools/web/rebuild-web.sh).
      - name: Build web bundle (tools/web/build.sh)
        run: bash tools/web/build.sh --release

      - name: Verify build outputs
        run: |
          ls -lh build/web/index.html
          ls -lh build/web/fruit-ninja-*.js build/web/fruit-ninja-*.wasm build/web/fruit-ninja-*.data
          ls -lh build/web/manifest.webmanifest build/web/sw.js build/web/favicon.ico

      - name: Assemble pages/
        run: python tools/web/build_pages.py

      - name: Verify pages/ structure
        run: |
          ls -la pages/
          test -f pages/index.html
          test -f pages/.nojekyll
          ls pages/fruit-ninja-*.js pages/fruit-ninja-*.wasm pages/fruit-ninja-*.data

      # Must run after build_pages.py -- that rmtree()s pages/ first.
      - name: Build asset gallery
        run: bash tools/web/build-gallery.sh pages/gallery

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
