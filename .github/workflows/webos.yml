name: Build webOS

# Manual trigger, plus automatic on pushes that touch webOS-relevant paths
# (mirrors moonlight-tv's build-test.yml build-webos job, adapted to this
# repo's dispatch-first convention -- see pages.yml).
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'deploy/webos/**'
      - 'tools/webos/**'
      - 'tools/assets/**'
      - 'CMakeLists.txt'
      - '.github/workflows/webos.yml'
      # The job uses the local fetch-game-assets composite action, so changes
      # to it must retrigger this build -- otherwise action fixes ship untested.
      - '.github/actions/**'
  # Release path. A `push` trigger cannot express "branch pushes matching paths
  # OR any v* tag": GitHub ANDs the ref filter with the paths filter, and
  # declaring `tags` without `branches` would stop branch pushes triggering at
  # all. So webos-release.yml owns the tag trigger and calls this workflow --
  # one build definition, and the non-release path above is untouched.
  workflow_call:

env:
  WEBOS_SDK: /opt/arm-webos-linux-gnueabi_sdk-buildroot
  FN_WEBOS_VENV: /opt/fn-webos-venv

jobs:
  build-webos:
    name: Build (webOS)
    runs-on: ubuntu-latest

    # Needed only by the tag-gated publish steps at the end (creating the
    # release and uploading its assets). Every other run leaves it unused.
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ffmpeg is required by tools/assets/stage-assets.py: the webOS build
      # defaults FN_OGG_AUDIO=ON, so staging transcodes sfx/*.wav.pcm to Ogg
      # Vorbis. Without it staging aborts ("ffmpeg not found on PATH").
      - name: Install Build Tools
        run: sudo apt-get -yq update && sudo apt-get -y -qq install cmake ninja-build ffmpeg

      - name: Download webOS NDK
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "openlgtv/buildroot-nc4"
          latest: true
          # Upstream renamed the SDK assets to be host-arch specific (release
          # webos-a38c582 onwards): "<triple>_sdk-buildroot-<hostarch>.tar.gz".
          # ubuntu-latest runners are x86_64. The tarball still extracts to
          # arm-webos-linux-gnueabi_sdk-buildroot/ (WEBOS_SDK above) and still
          # ships relocate-sdk.sh, so only the download name changes.
          fileName: "arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
          out-file-path: "/tmp"

      - name: Extract + Relocate webOS NDK
        shell: bash
        run: |
          sudo mkdir -p "$(dirname "$WEBOS_SDK")"
          sudo tar xzf /tmp/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz -C "$(dirname "$WEBOS_SDK")"
          sudo "$WEBOS_SDK/relocate-sdk.sh"

      - name: Create Python venv (asset staging deps)
        shell: bash
        run: |
          sudo python3 -m venv --system-site-packages "$FN_WEBOS_VENV"
          sudo "$FN_WEBOS_VENV/bin/pip" install --upgrade pip
          sudo "$FN_WEBOS_VENV/bin/pip" install Pillow resvg-py fonttools

      - name: Download ares-cli-rs (ares-package)
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/ares-cli-rs"
          latest: true
          # Pin the host arch: releases ship both _amd64 and _arm64 .deb, and a
          # bare "ares-package_*.deb" glob pulls BOTH -- the later
          # "apt-get install ./temp/*.deb" then fails on the foreign-arch package.
          # ubuntu-latest runners are amd64.
          fileName: "ares-package_*_amd64.deb"
          out-file-path: "temp"

      - name: Download Homebrew Toolbox (webosbrew-ipk-verify)
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/dev-toolbox-cli"
          latest: true
          # Same arch pin as above (this repo currently publishes amd64 only,
          # but keep it explicit so an added arm64 build can't break the job).
          fileName: "webosbrew-toolbox-*_amd64.deb"
          out-file-path: "temp"

      - name: Install webOS Packaging Tools
        run: sudo apt-get install ./temp/*.deb

      # tools/webos/build.sh's staging step needs the original game asset
      # dump (FruitNinjaBada/Data) -- same fetch used by the Pages workflow.
      - name: Fetch game assets
        uses: ./.github/actions/fetch-game-assets

      - name: Build + Package
        shell: bash
        run: bash tools/webos/build.sh

      - name: Compatibility Check
        shell: bash
        run: webosbrew-ipk-verify -f markdown dist/*.ipk >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .ipk
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: dist/*.ipk

      # ---- Release path (tag pushes only, via webos-release.yml) ----
      #
      # Everything below is gated on a v* tag, so a normal push still just
      # builds and uploads the artifact above. The Compatibility Check step
      # runs first and fails the job on a bad ABI, so a broken .ipk can never
      # reach a release.

      - name: Generate Homebrew Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          # github.ref_name is the caller's ref, i.e. the tag, even though this
          # workflow runs as a reusable callee.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          IPK="$(ls dist/*.ipk | head -n1)"
          IPK_NAME="$(basename "$IPK")"

          # webosbrew-gen-manifest is the binary shipped by the
          # webosbrew-toolbox-gen-manifest deb installed above (the deb name is
          # not the command name). --root false: plain native app, no root.
          # --icon must be a public URL; deploy/webos/icon.png is committed, so
          # pin the raw URL to the tag rather than a branch, so an old
          # manifest keeps resolving after main moves on.
          webosbrew-gen-manifest \
            --pkgfile "$IPK" \
            --output dist/manifest.tmp.json \
            --icon "https://raw.githubusercontent.com/${REPO}/${TAG}/deploy/webos/icon.png" \
            --link "https://github.com/${REPO}" \
            --root false

          # gen-manifest fills ipkUrl with the *basename* of --pkgfile (it opens
          # the file locally to hash it, so --pkgfile cannot be a URL). The repo
          # generator urljoin()s ipkUrl against the manifest URL, so a bare name
          # would resolve for repo.webosbrew.org -- but every manifest actually
          # published there carries an absolute URL, and anything fetching the
          # manifest on its own (Homebrew Channel install-from-URL, curl) needs
          # one. Rewrite it to the release asset URL, which is predictable.
          APP_ID="$(jq -r .id dist/manifest.tmp.json)"
          jq --arg url "https://github.com/${REPO}/releases/download/${TAG}/${IPK_NAME}" \
            '.ipkUrl = $url' dist/manifest.tmp.json > "dist/${APP_ID}.manifest.json"
          rm dist/manifest.tmp.json

          cat "dist/${APP_ID}.manifest.json"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Creates the release for the pushed tag if it does not exist yet, and
          # only adds assets to an existing one.
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.ipk
            dist/*.manifest.json
