name: Build Wii

# Manual trigger, plus automatic on pushes that touch Wii-relevant paths
# (mirrors webos.yml's dispatch + path-filter shape).
on:
  workflow_dispatch:
  push:
    # Branch pushes only -- a v* tag push whose diff touches these paths would
    # otherwise fire this build too, which has nothing to do with a release.
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'tools/wii/**'
      - 'tools/assets/**'
      - 'tools/lib/**'          # bake-fonts.py imports from here
      - 'cmake/wii.toolchain.cmake'
      - 'cmake/assert-nonempty-dir.cmake'
      - 'CMakeLists.txt'
      - '.github/workflows/wii.yml'
      # The job uses the local fetch-game-assets composite action, so changes
      # to it must retrigger this build -- otherwise action fixes ship untested.
      - '.github/actions/**'
  # Release path. A `push` trigger cannot express "branch pushes matching paths
  # OR any v* tag": GitHub ANDs the ref filter with the paths filter, and
  # declaring `tags` without `branches` would stop branch pushes triggering at
  # all. So wii-release.yml owns the tag trigger and calls this workflow --
  # one build definition, and the non-release path above is untouched.
  workflow_call:

env:
  # freetype-py + Pillow live in a venv: Ubuntu's python3 is externally-managed
  # (PEP 668), so a bare `pip install` into it is refused.
  FN_WII_VENV: /opt/fn-wii-venv

jobs:
  build-wii:
    name: Build (Wii)
    runs-on: ubuntu-latest
    # Ships devkitPPC + libogc + general-tools (elf2dol) and exports
    # DEVKITPRO=/opt/devkitpro, which cmake/wii.toolchain.cmake requires.
    container: devkitpro/devkitppc

    # Needed only by the tag-gated publish step at the end (creating the
    # release and uploading its asset). Every other run leaves it unused.
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Most of these are already in the image; apt is a no-op then. cmake +
      # ninja build the tree, git + curl let FetchContent pull tinyxml2 from
      # GitHub at configure time, unzip is used by fetch-game-assets, and
      # python3-venv backs the freetype-py venv below.
      - name: Install Build Tools
        shell: bash
        run: |
          apt-get -yq update
          apt-get -y -qq install cmake ninja-build git curl unzip \
                                 python3 python3-venv libfreetype6
          cmake --version
          ninja --version

      # freetype-py: the Wii font bake (fn_wii_fonts) rasterizes every shipped
      # glyph with FreeType. Wii links no runtime TTF backend, so without this
      # the package renders NO TEXT.
      # Pillow: the HBC icon (fn_wii_icon) is composed from the game dump at
      # build time, never committed (copyrighted artwork).
      # Both configure steps hard-fail on a missing module rather than silently
      # skipping, so one venv serves both.
      - name: Create Python venv (font bake + icon deps)
        shell: bash
        run: |
          python3 -m venv --system-site-packages "$FN_WII_VENV"
          "$FN_WII_VENV/bin/pip" install --upgrade pip
          "$FN_WII_VENV/bin/pip" install freetype-py Pillow
          "$FN_WII_VENV/bin/python3" -c "import freetype; print('freetype-py import OK')"
          "$FN_WII_VENV/bin/python3" -c "import PIL; print('Pillow import OK')"

      # Asset staging AND the font-bake plan generators read the original game
      # asset dump from FruitNinjaBada/Data -- the action's default destination.
      - name: Fetch game assets
        uses: ./.github/actions/fetch-game-assets

      - name: Configure
        shell: bash
        run: |
          cmake -B build/wii -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/wii.toolchain.cmake \
                -DFRUIT_PLATFORM_WII=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DFN_WII_BAKE_PYTHON="$FN_WII_VENV/bin/python3" \
                -DFN_WII_ICON_PYTHON="$FN_WII_VENV/bin/python3"

      # build -> install -> cpack. The script's own env guard accepts the Linux
      # powerpc-eabi-g++ (no .exe) as well as the Windows/MSYS2 one.
      - name: Build + Package
        shell: bash
        run: bash tools/wii/build.sh

      # Belt and braces on top of the CMake-side assert inside fn_wii_fonts:
      # that assert never runs if the bake was skipped at configure time, and
      # this checks what actually landed in the installed package.
      - name: Verify prebaked fonts shipped
        shell: bash
        run: |
          PREBAKED=build/wii/dist/apps/fruitninja/Data/fonts/prebaked
          COUNT=$(find "$PREBAKED" -type f 2>/dev/null | wc -l)
          echo "prebaked font files: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: $PREBAKED is empty -- this package would render no text." >&2
            exit 1
          fi

      # The icon install is conditional on FN_WII_HAVE_ICON, so a configure that
      # decided the dump was absent ships an iconless package without failing.
      # CI always fetches the dump, so here that condition means something broke.
      - name: Verify HBC icon shipped
        shell: bash
        run: |
          ICON=build/wii/dist/apps/fruitninja/icon.png
          if [ ! -s "$ICON" ]; then
            echo "ERROR: $ICON missing or empty -- the Homebrew Channel entry would have no icon." >&2
            exit 1
          fi
          echo "icon.png: $(stat -c%s "$ICON") bytes"

      - name: Upload homebrew ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wii-homebrew
          path: build/wii/fruit-ninja-wii.zip
          if-no-files-found: error

      # ---- Release path (tag pushes only, via wii-release.yml) ----
      #
      # Everything below is gated on a v* tag, so a normal push still just
      # builds and uploads the artifact above. The two Verify steps run first
      # and fail the job, so a fontless or iconless package can never reach a
      # release.

      # CPack always names the package fruit-ninja-wii.zip, so every release
      # would otherwise carry an identically named asset and a downloaded copy
      # could not be traced back to a release. Unlike webOS -- where the .ipk
      # embeds a version in appinfo.json and in its own filename -- the Wii
      # package has no internal version field at all, so the tag in the
      # filename is the only version marker there is.
      - name: Name Release Asset After Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          # github.ref_name is the caller's ref, i.e. the tag, even though this
          # workflow runs as a reusable callee. Read it through env rather than
          # expanding it into the run script -- a tag name is attacker-
          # controllable text and must never be pasted into shell source.
          TAG: ${{ github.ref_name }}
        run: |
          set -eo pipefail

          # A tag containing a path separator would place the copy outside the
          # build dir, and the glob below would then miss it (or pick up
          # something else). Refuse the same shape webos.yml requires.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "ERROR: tag '$TAG' does not match the release pattern v<MAJOR>.<MINOR>.<REV>-<PATCH>" >&2
            echo "       e.g. v1.6.1-3 (upstream game version 1.6.1, port release 3)." >&2
            exit 1
          fi

          cp build/wii/fruit-ninja-wii.zip "build/wii/fruit-ninja-wii-${TAG}.zip"
          ls -l "build/wii/fruit-ninja-wii-${TAG}.zip"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Creates the release for the pushed tag if it does not exist yet, and
          # only adds assets to an existing one. webos-release.yml fires on the
          # same tag and publishes into the same release, so nothing here may
          # replace the whole asset set (clear_attachments) or set body /
          # body_path -- leaving them unset keeps the webOS assets and the
          # existing release notes untouched, whichever job lands first.
          tag_name: ${{ github.ref_name }}
          files: build/wii/fruit-ninja-wii-*.zip
