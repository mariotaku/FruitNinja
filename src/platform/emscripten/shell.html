<!DOCTYPE html>
<!-- Port specific: Custom Emscripten shell for Fruit Ninja web build.
     Phase 5 (audio gesture-resume) + Phase 7 (shell polish) combined.
     Letterboxed 3:2 canvas, loading progress bar, TAP TO START overlay
     that doubles as the required browser audio-gesture unlock.
     Required Emscripten placeholder: {{{ SCRIPT }}} -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fruit Ninja</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Port specific: #viewport is a full-window flex centering container.
       The canvas is positioned inside it and sized by JS letterbox scaling.
       We do NOT give #viewport a fixed pixel size -- that was causing the
       flexbox to collapse the width to ~62px on the 946x938 test window.
       Instead the canvas gets explicit CSS width/height from the resize()
       function and is centered via absolute positioning within this 100%
       container. */
    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas backing size is fixed at 960x640 (set by SDL_CreateWindow).
       JS sets canvas.style.width/height to the letterboxed CSS dimensions.
       touch-action:none prevents browser scroll-pan on swipe gestures so
       TransformTouchNormalized receives raw co-ordinates. */
    #canvas {
      display: block;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Port specific: splash image sits inside #viewport as an absolute sibling
       of the canvas.  resize() sets its CSS width/height to the same letterboxed
       dimensions as the canvas (scale*960 x scale*640), so the splash always
       covers exactly the game viewport rectangle.  object-fit:cover scales the
       512x512 PNG up to fill that 3:2 rect, cropping top/bottom as needed.
       The black letterbox bars outside #viewport's flex-centered child area are
       #viewport's own black background -- the splash never bleeds past the
       canvas rect.
       z-index 10 sits above the canvas (which has no explicit z-index) but
       below the tap-overlay (z-index 20). */
    #splash-img {
      position: absolute;
      display: block;
      object-fit: cover;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    /* Progress bar: absolutely positioned inside #viewport, sitting in the
       lower portion of the splash/canvas area.  JS sets its left/bottom/width
       to match the canvas rect so it stays inside the game viewport on resize.
       Style: classic Apple boot-bar -- thin pill track with hairline border,
       solid white fill growing left-to-right.  No gradient, no glow. */
    #progress-bar-wrap {
      position: absolute;
      height: 8px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      overflow: hidden;
      z-index: 11;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 3px;
      transition: width 0.15s ease;
    }

    /* --- TAP TO START overlay: absolutely positioned inside #viewport so it
       is clipped to the game viewport rectangle (same area as the canvas).
       JS sets its position/size to match the canvas rect.
       display:none initially; JS shows it when the runtime is ready.
       Sits above the splash (z-index 20) so the splash image shows behind it
       as a backdrop -- visually: splash + TAP TO START. --- */
    #tap-overlay {
      position: absolute;
      background: rgba(0, 0, 0, 0.72);
      display: none; /* shown by JS once runtime ready */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      gap: 1.4em;
    }

    #tap-overlay.visible {
      display: flex;
    }

    #tap-text {
      color: #fff;
      font-size: 2.8em;
      font-weight: bold;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(255,255,255,0.6), 0 2px 8px rgba(0,0,0,0.5);
      animation: pulse 2s ease-in-out infinite;
      cursor: pointer;
      padding: 0.2em 0.5em;
    }

    #tap-silent {
      color: #aaa;
      font-size: 1.05em;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      cursor: pointer;
      padding: 0.4em 1em;
      border: 1px solid #555;
      border-radius: 4px;
      background: transparent;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    #tap-silent:hover, #tap-silent:focus {
      color: #ccc;
      border-color: #888;
      outline: none;
    }

    @keyframes pulse {
      0%   { opacity: 1.0; transform: scale(1.00); }
      50%  { opacity: 0.55; transform: scale(0.97); }
      100% { opacity: 1.0; transform: scale(1.00); }
    }
  </style>
</head>
<body>
  <!-- Port specific: splash, progress bar, and tap-overlay all live INSIDE
       the viewport div so they are naturally clipped to the game-viewport
       rectangle (scale*960 x scale*640, flex-centered with black letterbox bars
       outside). resize() sets explicit CSS dimensions on the canvas, splash, and
       tap-overlay so they all coincide. -->
  <div id="viewport">
    <!-- Canvas: id="canvas" is what Emscripten looks up.  Backing size is
         960x640 (set by SDL_CreateWindow in mainEmscripten.cpp); JS resize()
         sets canvas.style.width/height so the CSS size letterboxes to the
         window without changing the backing resolution, keeping
         TransformTouchNormalized coords valid. -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <!-- Splash image: absolute sibling of canvas inside the viewport div.
         resize() sizes it identically to the canvas (same letterboxed rect).
         object-fit:cover fills the 3:2 rect from the 512x512 PNG.
         Referenced by relative URL -- loads immediately, before .data bundle. -->
    <img id="splash-img" src="splash.png" alt="" draggable="false">

    <!-- Progress bar: absolute inside the viewport div, lower portion of canvas
         rect. resize() positions it to the lower 18% of the canvas area. -->
    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>

    <!-- TAP TO START overlay: absolute sibling of canvas inside the viewport div.
         resize() sizes/positions it to match the canvas rect.
         Primary button resumes AudioContext (audio-gesture unlock) then starts.
         Secondary button skips audio resume and calls fn_disable_audio() so
         the in-game music/sfx toggles display as off from the first frame.
         Both buttons call fn_user_started() so BootWait can proceed.
         After dismiss the overlay is removed from DOM. -->
    <div id="tap-overlay" aria-modal="true" role="dialog" aria-label="Start game">
      <span id="tap-text" role="button" tabindex="0" aria-label="Tap to start">TAP TO START</span>
      <button id="tap-silent" tabindex="0">tap to start without audio</button>
    </div>
  </div>

  <script>
  /* Port specific: all overlay elements are inside the viewport div as absolute
     siblings of the canvas.  resize() sizes them to match the canvas's
     letterboxed CSS rect so splash/tap-overlay cover exactly the game
     viewport, and the progress bar sits in the lower portion of that rect.
     Black letterbox bars outside the 3:2 area are the viewport div's background. */
  (function () {
    var GAME_W = 960, GAME_H = 640;
    var canvas       = document.getElementById('canvas');
    var splashImg    = document.getElementById('splash-img');
    var progressWrap = document.getElementById('progress-bar-wrap');
    var tapOverlay   = document.getElementById('tap-overlay');

    function resize() {
      var ww = window.innerWidth, wh = window.innerHeight;
      var scale = Math.min(ww / GAME_W, wh / GAME_H);
      var cw = Math.floor(GAME_W * scale);
      var ch = Math.floor(GAME_H * scale);

      /* Canvas: letterboxed CSS size (backing stays 960x640). */
      canvas.style.width  = cw + 'px';
      canvas.style.height = ch + 'px';

      /* Splash: same dimensions as canvas, centered via absolute positioning
         that mirrors flexbox centering (left/top from center). */
      if (splashImg) {
        splashImg.style.width  = cw + 'px';
        splashImg.style.height = ch + 'px';
        splashImg.style.left   = Math.floor((ww - cw) / 2) + 'px';
        splashImg.style.top    = Math.floor((wh - ch) / 2) + 'px';
      }

      /* Tap-overlay: same rect as splash/canvas. */
      if (tapOverlay) {
        tapOverlay.style.width  = cw + 'px';
        tapOverlay.style.height = ch + 'px';
        tapOverlay.style.left   = Math.floor((ww - cw) / 2) + 'px';
        tapOverlay.style.top    = Math.floor((wh - ch) / 2) + 'px';
      }

      /* Progress bar: lower portion of the canvas rect (bottom 18% up from
         bottom of canvas area), horizontally centered, width 60% of canvas. */
      if (progressWrap) {
        var barW = Math.min(Math.floor(cw * 0.60), 420);
        var canvasLeft = Math.floor((ww - cw) / 2);
        var canvasTop  = Math.floor((wh - ch) / 2);
        progressWrap.style.width  = barW + 'px';
        progressWrap.style.left   = (canvasLeft + Math.floor((cw - barW) / 2)) + 'px';
        progressWrap.style.top    = (canvasTop + Math.floor(ch * 0.82 - 4)) + 'px';
      }
    }

    resize();
    window.addEventListener('resize', resize);
  })();

  var _progressBar  = document.getElementById('progress-bar');
  var _progressWrap = document.getElementById('progress-bar-wrap');
  var _splashImg    = document.getElementById('splash-img');
  var _tapOverlay   = document.getElementById('tap-overlay');
  var _tapText      = document.getElementById('tap-text');
  var _tapSilent    = document.getElementById('tap-silent');
  var _runtimeReady = false;

  /* Called when Module.calledRun is true (runtime loaded, BEFORE game init).
     Hides the progress bar, keeps the splash visible as backdrop for the
     TAP TO START buttons, and shows the tap-overlay over the splash. */
  function _showTapOverlay() {
    if (_runtimeReady) return;
    _runtimeReady = true;
    /* Hide progress bar -- download done. Splash stays as tap-overlay backdrop. */
    if (_progressWrap) _progressWrap.style.display = 'none';
    if (_tapOverlay) {
      _tapOverlay.style.display = 'flex';
      if (_tapText) _tapText.focus();
    }
  }

  function _resumeAudioContext() {
    try {
      var ctx = null;
      if (typeof Module !== 'undefined' && Module.SDL2) ctx = Module.SDL2.audioContext;
      if (!ctx && typeof SDL2 !== 'undefined') ctx = SDL2.audioContext;
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().then(function () {
          console.log('[audio] AudioContext resumed via tap gesture');
        }).catch(function (e) {
          console.warn('[audio] AudioContext.resume() rejected:', e);
        });
      }
    } catch (e) {
      console.warn('[audio] resume exception (non-fatal):', e);
    }
  }

  function _removeOverlay() {
    /* Remove tap-overlay and splash from DOM once game init is under way. */
    if (_tapOverlay && _tapOverlay.parentNode) _tapOverlay.parentNode.removeChild(_tapOverlay);
    if (_splashImg  && _splashImg.parentNode)  _splashImg.parentNode.removeChild(_splashImg);
  }

  function _notifyUserStarted() {
    try {
      if (typeof Module !== 'undefined' && Module._fn_user_started) Module._fn_user_started();
    } catch (ex) {
      console.warn('[boot] fn_user_started exception (non-fatal):', ex);
    }
  }

  function _dismissWithAudio(e) {
    e.stopPropagation(); e.preventDefault();
    _resumeAudioContext();
    _notifyUserStarted();
    _removeOverlay();
  }

  function _dismissSilent(e) {
    e.stopPropagation(); e.preventDefault();
    try {
      if (typeof Module !== 'undefined' && Module._fn_disable_audio) Module._fn_disable_audio();
    } catch (ex) {
      console.warn('[audio] fn_disable_audio exception (non-fatal):', ex);
    }
    _notifyUserStarted();
    _removeOverlay();
  }

  if (_tapText) {
    _tapText.addEventListener('click',      _dismissWithAudio);
    _tapText.addEventListener('touchstart', _dismissWithAudio, {passive: false});
    _tapText.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') _dismissWithAudio(e);
    });
  }
  if (_tapSilent) {
    _tapSilent.addEventListener('click',      _dismissSilent);
    _tapSilent.addEventListener('touchstart', _dismissSilent, {passive: false});
    _tapSilent.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') _dismissSilent(e);
    });
  }

  window.onerror = function (msg) {
    console.error('[onerror]', msg);
  };
  </script>

  <!-- Port specific: Module must be defined in its own <script> block,
       separate from the helpers above.  Emscripten's HTML minifier
       processes each <script> block independently; mixing the helper
       functions and the Module definition in one block caused the
       minifier to close the script tag early, leaving var Module = {}
       as raw HTML text (not executed JS) and thus Module["canvas"]
       undefined when GL.createContext ran.  Two blocks avoids this. -->
  <script>
  var Module = {
    canvas: (function () {
      var c = document.getElementById('canvas');
      if (c) {
        c.addEventListener('webglcontextlost', function (ev) {
          alert('WebGL context lost. Please reload the page.');
          ev.preventDefault();
        }, false);
      }
      return c;
    })(),

    print:    function () { console.log.apply(console, arguments); },
    printErr: function () { console.error.apply(console, arguments); },

    setStatus: function (text) {
      if (!text) return;
      var m = text.match(/\((\d+)\/(\d+)\)/);
      if (m) {
        var pct = Math.round(100 * parseInt(m[1]) / parseInt(m[2]));
        if (_progressBar) _progressBar.style.width = pct + '%';
      }
    },

    totalDependencies: 0,
  };

  (function () {
    var _pollInterval = setInterval(function () {
      if (typeof Module !== 'undefined' && Module.calledRun) {
        clearInterval(_pollInterval);
        clearTimeout(_safetyTimeout);
        _showTapOverlay();
      }
    }, 100);

    var _safetyTimeout = setTimeout(function () {
      clearInterval(_pollInterval);
      console.warn('[shell] safety fallback: forcing tap overlay reveal');
      _showTapOverlay();
    }, 30000);
  })();
  </script>

  <!-- Port specific: Emscripten injects the generated <script> tag here.
       This MUST be after the Module definition above. -->
  {{{ SCRIPT }}}
</body>
</html>
