<!DOCTYPE html>
<!-- Port specific: Custom Emscripten shell for Fruit Ninja web build.
     Phase 5 (audio gesture-resume) + Phase 7 (shell polish) combined.
     Letterboxed 3:2 canvas, loading progress bar, TAP TO START overlay
     that doubles as the required browser audio-gesture unlock.
     Required Emscripten placeholder: {{{ SCRIPT }}} -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fruit Ninja</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Port specific: #viewport is a full-window flex centering container.
       The canvas is positioned inside it and sized by JS letterbox scaling.
       We do NOT give #viewport a fixed pixel size -- that was causing the
       flexbox to collapse the width to ~62px on the 946x938 test window.
       Instead the canvas gets explicit CSS width/height from the resize()
       function and is centered via absolute positioning within this 100%
       container. */
    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas backing size is fixed at 960x640 (set by SDL_CreateWindow).
       JS sets canvas.style.width/height to the letterboxed CSS dimensions.
       touch-action:none prevents browser scroll-pan on swipe gestures so
       TransformTouchNormalized receives raw co-ordinates. */
    #canvas {
      display: block;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Port specific: splash image sits inside #viewport as an absolute sibling
       of the canvas.  resize() sets its CSS width/height to the same letterboxed
       dimensions as the canvas (scale*960 x scale*640), so the splash always
       covers exactly the game viewport rectangle.

       object-fit:fill (NOT cover) matches how the GAME renders its in-game
       splash: DrawStartFade (src/game/StartupEffects.cpp) draws a unit quad
       scaled to FN_SCREEN_W x FN_SCREEN_H (480x320) under the game ortho
       (SetupOrtho(160,-160,-240,240,...)), so the splash quad spans the ENTIRE
       480x320 logical area = the ENTIRE 960x640 canvas, with no preserved
       aspect (the texture is stretched to fill the whole 3:2 rect).  The shell
       splash.webp IS the same asset the game draws: the visible logo region of
       Data/textures/HB_logo.tex (the v1.6.1 game splash texture) cropped to the
       game's UV rect (u 0.03125..0.96875, v 0.1875..0.8125 of the 512x512 tex
       = a 480x320 3:2 region) and re-encoded as WebP.  Earlier this file shipped
       an unrelated 800x480 (5:3) "(c) 2010 Halfbrick" image; HB_logo.tex reads
       "(c) 2011 Halfbrick", so the shell and the in-game splash showed two
       different copyright lines at the WebGL hand-off.  object-fit:fill maps the
       whole image onto the whole canvas rect exactly like the game's quad, so
       the hand-off is seamless.
       The black letterbox bars outside #viewport's flex-centered child area are
       #viewport's own black background -- the splash never bleeds past the
       canvas rect.
       z-index 10 sits above the canvas (which has no explicit z-index) but
       below the tap-overlay (z-index 20). */
    #splash-img {
      position: absolute;
      display: block;
      object-fit: fill;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    /* Loading cover: a black, soft-edged strip that sits over the splash's
       baked "Loading..." text (z-index 11, above the splash at 10) so the
       progress bar can replace that label.  border-radius rounds the corners
       and the black box-shadow spread acts as a same-colour drop shadow that
       feathers the edges into the dark splash -- no hard rectangle outline.
       resize() centres it on the "Loading..." label (fLabel) via the same
       object-fit:cover mapping used for the bar. */
    #loading-cover {
      position: absolute;
      background: #000;
      border-radius: 12px;
      /* Asymmetric feather: the negative Y offset shifts the shadow up so the
         DOWNWARD reach (blur+spread+offsetY = 14+4-8) is only ~10px and stops
         short of the copyright lines, while the top/sides stay soft (~26px). */
      box-shadow: 0 -8px 14px 4px #000;
      z-index: 11;
      pointer-events: none;
    }

    /* Progress bar: absolutely positioned inside #viewport, drawn OVER the
       "Loading..." label -- on top of #loading-cover (z-index 12 > 11).
       JS resize() maps fLabel through object-fit:cover geometry to compute the
       screen Y; horizontal centering tracks the canvas width.
       Style: classic Apple boot-bar -- thin pill track with hairline border,
       solid white fill growing left-to-right.  No gradient, no glow. */
    #progress-bar-wrap {
      position: absolute;
      height: 8px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      overflow: hidden;
      z-index: 12;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 3px;
      transition: width 0.15s ease;
    }

    /* --- TAP TO START overlay: absolutely positioned inside #viewport so it
       is clipped to the game viewport rectangle (same area as the canvas).
       JS sets its position/size to match the canvas rect.
       display:none initially; JS shows it (opacity 0 -> 1 fade) when runtime
       is ready, and fades it out (opacity 1 -> 0) on dismiss before removeChild.
       Sits above the splash (z-index 20) so the splash image shows behind it
       as a backdrop -- visually: splash + TAP TO START. --- */
    #tap-overlay {
      position: absolute;
      background: rgba(0, 0, 0, 0.72);
      display: none; /* shown by JS once runtime ready */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      gap: 1.4em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* --- ERROR overlay: shown when the load fails or stalls.
       Fixed full-viewport so it is always visible regardless of canvas size.
       z-index 30 sits above tap-overlay (20) so it cannot be obscured. --- */
    #error-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none; /* shown by _showError() */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      gap: 0.9em;
      padding: 2em;
      text-align: center;
    }

    #error-msg {
      color: #fff;
      font-size: 1.25em;
      font-weight: bold;
    }

    #error-detail {
      color: rgba(255,255,255,0.72);
      font-size: 0.88em;
      max-width: 36em;
      word-break: break-word;
    }

    #error-reload {
      margin-top: 0.5em;
      padding: 0.55em 1.6em;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 6px;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease;
    }

    #error-reload:hover, #error-reload:focus {
      background: rgba(255,255,255,0.22);
      outline: none;
    }

    /* Game-asset launch UI -- no modern text.  #tap-play is the in-game white
       play button (textures/play_button.tex) reused as the single "tap to
       start" button.  Audio on/off is chosen via #sound-toggle (top-right),
       mirroring the in-game menu.  JS resize() sets pixel sizes relative to the
       canvas height. */
    #tap-play {
      display: block;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    #tap-play:hover, #tap-play:focus {
      transform: scale(1.06);
      filter: drop-shadow(0 4px 18px rgba(255,255,255,0.35));
      outline: none;
    }

    /* Sound toggle: absolutely positioned at the overlay's top-right, like the
       in-game menu's audio buttons.  Swaps sound.png (on) <-> sound_cross.png
       (off); its state decides whether the game starts with audio. */
    #sound-toggle {
      position: absolute;
      display: block;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
      transition: transform 0.12s ease;
    }
    #sound-toggle:hover, #sound-toggle:focus {
      transform: scale(1.08);
      outline: none;
    }

    /* Port specific: full-screen toggle button.  A corner overlay in the
       top-right of the window, sitting ABOVE the canvas (z-index 25) and above
       the tap-overlay's own top-right sound toggle area is irrelevant because
       this lives outside the viewport, fixed to the window corner.  Fixed
       positioning keeps it pinned regardless of letterbox bars; pointer-events
       are its own so taps here never reach the canvas/game.  Semi-transparent
       dark pill with an inline-SVG glyph that JS swaps between enter/exit. */
    #fullscreen-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      z-index: 25;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background 0.15s ease, transform 0.12s ease;
    }
    #fullscreen-btn:hover, #fullscreen-btn:focus {
      background: rgba(0, 0, 0, 0.62);
      transform: scale(1.06);
      outline: none;
    }
    #fullscreen-btn svg {
      width: 22px;
      height: 22px;
      display: block;
      pointer-events: none; /* let the button receive the event, not the glyph */
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <!-- Port specific: splash, progress bar, and tap-overlay all live INSIDE
       the viewport div so they are naturally clipped to the game-viewport
       rectangle (scale*960 x scale*640, flex-centered with black letterbox bars
       outside). resize() sets explicit CSS dimensions on the canvas, splash, and
       tap-overlay so they all coincide. -->
  <div id="viewport">
    <!-- Canvas: id="canvas" is what Emscripten looks up.  Backing size is
         960x640 (set by SDL_CreateWindow in mainEmscripten.cpp); JS resize()
         sets canvas.style.width/height so the CSS size letterboxes to the
         window without changing the backing resolution, keeping
         TransformTouchNormalized coords valid. -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <!-- Splash image: absolute sibling of canvas inside the viewport div.
         resize() sizes it identically to the canvas (same letterboxed rect).
         object-fit:cover fills the 3:2 rect from the 512x512 PNG.
         Referenced by relative URL -- loads immediately, before .data bundle. -->
    <img id="splash-img" src="splash.webp" alt="" draggable="false">

    <!-- Loading cover: black, feathered (radius + drop-shadow) strip drawn over
         the splash's baked "Loading..." text. resize() centres it on the label
         so the progress bar can replace that text. -->
    <div id="loading-cover"></div>

    <!-- Progress bar: absolute inside the viewport div.
         resize() maps fLabel (the "Loading..." label centre in the 512x512
         splash) through the object-fit:cover transform to find the screen Y,
         then centers the bar over that label, on top of #loading-cover. -->
    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>

    <!-- TAP TO START overlay: absolute sibling of canvas inside the viewport div.
         resize() sizes/positions it to match the canvas rect.
         Primary button resumes AudioContext (audio-gesture unlock) then starts.
         Secondary button skips audio resume and calls fn_disable_audio() so
         the in-game music/sfx toggles display as off from the first frame.
         Both buttons call fn_user_started() so BootWait can proceed.
         After dismiss the overlay is removed from DOM. -->
    <div id="tap-overlay" aria-modal="true" role="dialog" aria-label="Start game">
      <!-- Sound toggle (top-right, like the in-game menu). Default ON; tapping
           it flips the icon and the audio-start choice. -->
      <img id="sound-toggle" src="sound.webp" role="button" tabindex="0"
           aria-label="Toggle sound" alt="Sound on" draggable="false">
      <!-- Single play button: starts the game with audio on/off per the toggle. -->
      <img id="tap-play" src="play_button.webp" role="button" tabindex="0"
           alt="Tap to start" draggable="false">
    </div>

    <!-- Error overlay: shown by _showError() when the load fails or stalls.
         Positioned fixed (full viewport) so it is always visible above everything.
         Hidden by default; _showError() sets display:flex. -->
    <div id="error-overlay" role="alertdialog" aria-modal="true" aria-label="Load error">
      <div id="error-msg">Couldn't load the game.</div>
      <div id="error-detail"></div>
      <button id="error-reload" tabindex="0">Reload</button>
    </div>

    <!-- Port specific: full-screen toggle button.  Fixed to the top-right
         window corner, above the canvas (z-index 25).  Its own click/touch
         handler toggles fullscreen on #viewport (so the letterboxed canvas +
         black bars fill the screen) and requests landscape orientation.
         Hidden until the game starts (shown by _dismissPlay).  The inline SVG
         starts as the ENTER-fullscreen glyph; JS swaps it to the EXIT glyph on
         fullscreenchange.  pointer-events on the SVG are off so the button div
         is the event target; the handler stops propagation so the tap never
         reaches the canvas/game as a slice. -->
    <div id="fullscreen-btn" role="button" tabindex="0"
         aria-label="Toggle full screen" title="Full screen" style="display:none;">
      <svg id="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true">
        <!-- Enter-fullscreen glyph: four outward corner brackets. -->
        <path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15"></path>
      </svg>
    </div>
  </div>

  <script>
  /* Port specific: all overlay elements are inside the viewport div as absolute
     siblings of the canvas.  resize() sizes them to match the canvas's
     letterboxed CSS rect so splash/tap-overlay cover exactly the game
     viewport, and the progress bar sits in the lower portion of that rect.
     Black letterbox bars outside the 3:2 area are the viewport div's background. */
  (function () {
    var GAME_W = 960, GAME_H = 640;
    var canvas       = document.getElementById('canvas');
    var splashImg    = document.getElementById('splash-img');
    var loadingCover = document.getElementById('loading-cover');
    var progressWrap = document.getElementById('progress-bar-wrap');
    var tapOverlay   = document.getElementById('tap-overlay');
    var tapPlay      = document.getElementById('tap-play');
    var soundToggle  = document.getElementById('sound-toggle');

    function resize() {
      var ww = window.innerWidth, wh = window.innerHeight;
      var scale = Math.min(ww / GAME_W, wh / GAME_H);
      var cw = Math.floor(GAME_W * scale);
      var ch = Math.floor(GAME_H * scale);

      /* Canvas: letterboxed CSS size (backing stays 960x640). */
      canvas.style.width  = cw + 'px';
      canvas.style.height = ch + 'px';

      /* Splash: same dimensions as canvas, centered via absolute positioning
         that mirrors flexbox centering (left/top from center). */
      if (splashImg) {
        splashImg.style.width  = cw + 'px';
        splashImg.style.height = ch + 'px';
        splashImg.style.left   = Math.floor((ww - cw) / 2) + 'px';
        splashImg.style.top    = Math.floor((wh - ch) / 2) + 'px';
      }

      /* Tap-overlay: same rect as splash/canvas. */
      if (tapOverlay) {
        tapOverlay.style.width  = cw + 'px';
        tapOverlay.style.height = ch + 'px';
        tapOverlay.style.left   = Math.floor((ww - cw) / 2) + 'px';
        tapOverlay.style.top    = Math.floor((wh - ch) / 2) + 'px';
      }

      /* Game-asset launch UI: sizes scale with the canvas height.  The play
         button is 2x the previous size (0.40 of canvas height).  The square
         sound toggle sits at the overlay's top-right corner (a small inset),
         mirroring the in-game menu's audio buttons. */
      if (tapPlay) {
        var playSz = Math.round(ch * 0.40);
        tapPlay.style.width  = playSz + 'px';
        tapPlay.style.height = playSz + 'px';
      }
      if (soundToggle) {
        var sndSz = Math.max(Math.round(ch * 0.11), 28);
        var sndPad = Math.round(ch * 0.045);
        soundToggle.style.width  = sndSz + 'px';
        soundToggle.style.height = sndSz + 'px';
        soundToggle.style.top    = sndPad + 'px';
        soundToggle.style.right  = sndPad + 'px';
      }

      /* Loading cover + progress bar: both centre on the splash's baked
         "Loading..." label so the bar visually replaces that text.
         The splash is now the cropped HB_logo.tex region (480x320, 3:2) the game
         itself draws -- the SAME asset, baked "Loading..." text and all.  fLabel
         is the "Loading..." text centre as a fraction of the splash height.
         The splash uses object-fit:fill (see #splash-img comment) to match the
         in-game splash quad, so the whole 480x320 image is mapped onto the whole
         canvas rect with no crop: the image rect IS the canvas rect.  Both axes
         scale linearly, so the source-pixel measurements below scale by cw/IMG_W
         and ch/IMG_H. */
      var IMG_W = 480, IMG_H = 320;
      var canvasLeft = Math.floor((ww - cw) / 2);
      var canvasTop  = Math.floor((wh - ch) / 2);
      /* fill: image covers the canvas rect exactly, so the per-axis scale for
         positioning the cover/bar (which are measured in source-image pixels)
         is cw/IMG_W horizontally and ch/IMG_H vertically. */
      var imgScaleX  = cw / IMG_W;
      var imgScaleY  = ch / IMG_H;
      var fLabel     = 0.85;   /* "Loading..." text centre in the 800x480 splash */
      var labelCenterY = Math.round(canvasTop + fLabel * ch);

      /* Black feathered cover over the baked "Loading..." text.  Sized from the
         measured text box in the 480x320 splash -- the "Loading..." glyphs span
         ~92x18 px centred at y~0.85 -- plus margin, then scaled per-axis so
         the cover tracks the splash at every viewport size and always fully
         blankets the text.  The box-shadow feather (CSS) extends further still. */
      if (loadingCover) {
        var coverW = Math.round(133 * imgScaleX);  /* 92px text + ~20px margin/side */
        var coverH = Math.round(34  * imgScaleY);  /* 18px text + ~8px margin/side */
        var coverTop = labelCenterY - Math.floor(coverH / 2);
        loadingCover.style.width  = coverW + 'px';
        loadingCover.style.height = coverH + 'px';
        loadingCover.style.left   = (canvasLeft + Math.floor((cw - coverW) / 2)) + 'px';
        loadingCover.style.top    = coverTop + 'px';
      }

      /* Progress bar: scales linearly with the 480x320 base resolution.
         uiScale maps the letterboxed canvas width back to the 480-wide base
         (cw==480 -> 1x, cw==960 -> 2x), so the bar grows from the centre in
         lock-step with the viewport.  Base bar is 156x4 px at 1x, giving the
         previous 312x8 px at the 960x640 backing size.  Height/border-radius
         scale too so the pill keeps its proportions at every size. */
      if (progressWrap) {
        var uiScale = cw / 480;
        var barW = Math.round(156 * uiScale);
        var barH = Math.max(Math.round(4 * uiScale), 2);
        var barTop = labelCenterY - Math.floor(barH / 2);
        /* Clamp so bar stays within the canvas rect. */
        if (barTop < canvasTop) barTop = canvasTop;
        if (barTop > canvasTop + ch - barH) barTop = canvasTop + ch - barH;
        progressWrap.style.width        = barW + 'px';
        progressWrap.style.height       = barH + 'px';
        progressWrap.style.borderRadius = Math.round(barH / 2) + 'px';
        progressWrap.style.left         = (canvasLeft + Math.floor((cw - barW) / 2)) + 'px';
        progressWrap.style.top          = barTop + 'px';
      }
    }

    resize();
    window.addEventListener('resize', resize);
    /* Port specific: expose resize() so the fullscreen/orientation handler
       (a separate script block / IIFE) can re-letterbox the canvas after the
       viewport changes on enter/exit fullscreen and on orientation change. */
    window._fnResize = resize;
  })();

  var _progressBar  = document.getElementById('progress-bar');
  var _progressWrap = document.getElementById('progress-bar-wrap');
  var _loadingCover = document.getElementById('loading-cover');
  var _splashImg    = document.getElementById('splash-img');
  var _tapOverlay   = document.getElementById('tap-overlay');
  var _tapPlay      = document.getElementById('tap-play');
  var _soundToggle  = document.getElementById('sound-toggle');
  var _fullscreenBtn = document.getElementById('fullscreen-btn');
  var _fullscreenIcon = document.getElementById('fullscreen-icon');
  var _errorOverlay = document.getElementById('error-overlay');
  var _errorDetail  = document.getElementById('error-detail');
  var _audioOn      = true;   /* sound-toggle state; decides audio-on at start */
  var _runtimeReady = false;
  var _loadFailed   = false;
  /* Anchored at script parse time; updated by Module.setStatus on each progress
     tick.  The stall watchdog compares Date.now() against this value. */
  var _lastProgressTime = Date.now();
  /* Last progress percentage seen (0-100); used by the absolute fallback to
     decide whether the download completed before giving up. */
  var _lastProgressPct  = 0;

  /* Called when Module.calledRun is true (runtime loaded, BEFORE game init).
     Hides the progress bar, keeps the splash visible as backdrop for the
     TAP TO START buttons, and fades the tap-overlay in (opacity 0 -> 1). */
  function _showTapOverlay() {
    if (_runtimeReady) return;
    _runtimeReady = true;
    /* Hide progress bar -- download done. Splash stays as tap-overlay backdrop. */
    if (_progressWrap) _progressWrap.style.display = 'none';
    if (_tapOverlay) {
      /* Reliable fade-in: set display:flex and opacity:0 together so the
         element enters layout with an established opacity:0 state, then
         force a synchronous reflow so the browser commits that state before
         we flip opacity to 1. Without the reflow the display change and the
         opacity change land in the same frame and no transition fires. */
      _tapOverlay.style.display = 'flex';
      _tapOverlay.style.opacity = '0';
      void _tapOverlay.offsetHeight; /* force reflow */
      _tapOverlay.style.opacity = '1';
      if (_tapPlay) _tapPlay.focus();
    }
  }

  /* Show the error overlay with a detail message.  Guards against being called
     after a successful start (_runtimeReady) or after a previous failure
     (_loadFailed) so a late watchdog tick cannot clobber a running game. */
  function _showError(msg) {
    if (_runtimeReady || _loadFailed) return;
    _loadFailed = true;
    if (_progressWrap) _progressWrap.style.display = 'none';
    if (_tapOverlay)   _tapOverlay.style.display   = 'none';
    if (_errorDetail)  _errorDetail.textContent     = msg || '';
    if (_errorOverlay) _errorOverlay.style.display  = 'flex';
    var reloadBtn = document.getElementById('error-reload');
    if (reloadBtn) reloadBtn.focus();
  }

  (function () {
    var reloadBtn = document.getElementById('error-reload');
    if (!reloadBtn) return;
    function _doReload(e) { e.preventDefault(); location.reload(); }
    reloadBtn.addEventListener('click',      _doReload);
    reloadBtn.addEventListener('touchstart', _doReload, {passive: false});
    reloadBtn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') _doReload(e);
    });
  })();

  function _resumeAudioContext() {
    try {
      var ctx = null;
      if (typeof Module !== 'undefined' && Module.SDL2) ctx = Module.SDL2.audioContext;
      if (!ctx && typeof SDL2 !== 'undefined') ctx = SDL2.audioContext;
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().then(function () {
          console.log('[audio] AudioContext resumed via tap gesture');
        }).catch(function (e) {
          console.warn('[audio] AudioContext.resume() rejected:', e);
        });
      }
    } catch (e) {
      console.warn('[audio] resume exception (non-fatal):', e);
    }
  }

  function _removeOverlayNow() {
    /* Immediate DOM removal -- called after fade-out transition completes.
       The loading cover is removed alongside the splash so the baked
       "Loading..." text it hid never reappears as the splash is torn down. */
    if (_tapOverlay && _tapOverlay.parentNode) _tapOverlay.parentNode.removeChild(_tapOverlay);
    if (_loadingCover && _loadingCover.parentNode) _loadingCover.parentNode.removeChild(_loadingCover);
    if (_splashImg  && _splashImg.parentNode)  _splashImg.parentNode.removeChild(_splashImg);
  }

  function _removeOverlayFade() {
    /* Fade out the overlay (opacity 1 -> 0), then remove from DOM.
       pointer-events:none is set immediately so a fading overlay cannot
       intercept input during the transition.
       transitionend fires once; setTimeout fallback covers browsers that
       suppress transitionend when the element is already gone or hidden. */
    if (!_tapOverlay) { _removeOverlayNow(); return; }
    _tapOverlay.style.pointerEvents = 'none';
    _tapOverlay.style.opacity = '0';
    var _done = false;
    function _onFadeDone() {
      if (_done) return;
      _done = true;
      _removeOverlayNow();
    }
    _tapOverlay.addEventListener('transitionend', _onFadeDone);
    /* 350ms fallback: slightly longer than the 0.3s CSS transition. */
    setTimeout(_onFadeDone, 350);
  }

  function _notifyUserStarted() {
    try {
      if (typeof Module !== 'undefined' && Module._fn_user_started) Module._fn_user_started();
    } catch (ex) {
      console.warn('[boot] fn_user_started exception (non-fatal):', ex);
    }
  }

  /* Sound toggle: flip the audio-start choice and swap the icon. Does NOT
     start the game -- only the play button dismisses the overlay. */
  function _toggleSound(e) {
    e.stopPropagation(); e.preventDefault();
    _audioOn = !_audioOn;
    if (_soundToggle) {
      _soundToggle.src = _audioOn ? 'sound.webp' : 'sound_cross.webp';
      _soundToggle.setAttribute('aria-label', _audioOn ? 'Sound on' : 'Sound off');
    }
  }

  /* Single play button: start with audio on/off per the sound toggle. */
  function _dismissPlay(e) {
    e.stopPropagation(); e.preventDefault();
    if (_audioOn) {
      /* Resume the suspended AudioContext via this user gesture. */
      _resumeAudioContext();
    } else {
      /* Mark the game muted so the in-game music/sfx toggles read off. */
      try {
        if (typeof Module !== 'undefined' && Module._fn_disable_audio) Module._fn_disable_audio();
      } catch (ex) {
        console.warn('[audio] fn_disable_audio exception (non-fatal):', ex);
      }
    }
    /* Fire game callbacks immediately -- don't wait for the fade. */
    _notifyUserStarted();
    /* Reveal the full-screen toggle now that the game is running. */
    if (_fullscreenBtn) _fullscreenBtn.style.display = 'flex';
    /* Fade out overlay; DOM removal happens after transition completes. */
    _removeOverlayFade();
  }

  if (_tapPlay) {
    _tapPlay.addEventListener('click',      _dismissPlay);
    _tapPlay.addEventListener('touchstart', _dismissPlay, {passive: false});
    _tapPlay.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') _dismissPlay(e);
    });
  }
  if (_soundToggle) {
    _soundToggle.addEventListener('click',      _toggleSound);
    _soundToggle.addEventListener('touchstart', _toggleSound, {passive: false});
    _soundToggle.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') _toggleSound(e);
    });
  }

  /* Port specific: full-screen toggle + landscape-orientation request.
     -----------------------------------------------------------------------
     - The element we fullscreen is #viewport (the container wrapping the
       canvas + black letterbox bars), so the whole game rectangle fills the
       screen.
     - On ENTER we best-effort lock landscape via screen.orientation.lock();
       it rejects on desktop and where unsupported, so both the synchronous
       throw (try/catch) and the async promise rejection (.catch) are handled
       so it NO-OPS gracefully -- never throws, never blocks.
     - On EXIT we best-effort screen.orientation.unlock() in try/catch.
     - After any fullscreen/orientation change we re-call the shell resize()
       so the canvas re-letterboxes to the new viewport.
     - The button has its own handler that stopPropagation()/preventDefault()s
       so the tap never reaches the canvas as a game slice. */
  (function () {
    if (!_fullscreenBtn) return;

    /* Enter-fullscreen glyph (outward corners) vs exit glyph (inward corners). */
    var ENTER_PATH = 'M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15';
    var EXIT_PATH  = 'M9 4 V9 H4 M20 9 H15 V4 M4 15 H9 V20 M15 20 V15 H20';

    function _isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function _reLetterbox() {
      /* Re-letterbox to the new viewport.  Defer one frame so the browser has
         committed the new innerWidth/innerHeight after the fullscreen swap. */
      if (typeof window._fnResize === 'function') {
        window._fnResize();
        setTimeout(window._fnResize, 60);
      }
    }

    function _lockLandscape() {
      try {
        if (screen && screen.orientation && typeof screen.orientation.lock === 'function') {
          var p = screen.orientation.lock('landscape');
          if (p && typeof p.then === 'function') {
            p.then(function () {
              _reLetterbox();
            }).catch(function (e) {
              /* Rejects on desktop / unsupported -- harmless no-op. */
              console.log('[fullscreen] orientation.lock rejected (non-fatal):', e && e.message);
            });
          }
        }
      } catch (e) {
        console.log('[fullscreen] orientation.lock threw (non-fatal):', e && e.message);
      }
    }

    function _unlockOrientation() {
      try {
        if (screen && screen.orientation && typeof screen.orientation.unlock === 'function') {
          screen.orientation.unlock();
        }
      } catch (e) {
        console.log('[fullscreen] orientation.unlock threw (non-fatal):', e && e.message);
      }
    }

    function _requestFullscreen(el) {
      try {
        if (el.requestFullscreen)            return el.requestFullscreen();
        if (el.webkitRequestFullscreen)      return el.webkitRequestFullscreen();
      } catch (e) {
        console.log('[fullscreen] requestFullscreen threw (non-fatal):', e && e.message);
      }
      return null;
    }

    function _exitFullscreen() {
      try {
        if (document.exitFullscreen)         return document.exitFullscreen();
        if (document.webkitExitFullscreen)   return document.webkitExitFullscreen();
      } catch (e) {
        console.log('[fullscreen] exitFullscreen threw (non-fatal):', e && e.message);
      }
      return null;
    }

    function _toggleFullscreen(e) {
      /* CRITICAL: stop the tap from reaching the canvas/game as a slice. */
      if (e) { e.stopPropagation(); e.preventDefault(); }
      var viewport = document.getElementById('viewport');
      if (!viewport) return;
      if (!_isFullscreen()) {
        var p = _requestFullscreen(viewport);
        /* Lock orientation after the request resolves where possible, else
           immediately (fullscreenchange also fires and re-letterboxes). */
        if (p && typeof p.then === 'function') {
          p.then(_lockLandscape).catch(function (err) {
            console.log('[fullscreen] requestFullscreen rejected (non-fatal):', err && err.message);
          });
        } else {
          _lockLandscape();
        }
      } else {
        _unlockOrientation();
        _exitFullscreen();
      }
    }

    function _onFullscreenChange() {
      var fs = _isFullscreen();
      if (_fullscreenIcon) {
        var path = _fullscreenIcon.querySelector('path');
        if (path) path.setAttribute('d', fs ? EXIT_PATH : ENTER_PATH);
      }
      _fullscreenBtn.setAttribute('aria-label', fs ? 'Exit full screen' : 'Toggle full screen');
      _fullscreenBtn.setAttribute('title',      fs ? 'Exit full screen' : 'Full screen');
      if (!fs) {
        /* Left fullscreen by any means (Esc, system gesture) -- release lock. */
        _unlockOrientation();
      }
      _reLetterbox();
    }

    _fullscreenBtn.addEventListener('click',      _toggleFullscreen);
    _fullscreenBtn.addEventListener('touchstart', _toggleFullscreen, {passive: false});
    _fullscreenBtn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') _toggleFullscreen(e);
    });
    document.addEventListener('fullscreenchange',       _onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', _onFullscreenChange);
    /* Re-letterbox on orientation change too (the viewport dims swap). */
    if (screen && screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', _reLetterbox);
    }
    window.addEventListener('orientationchange', _reLetterbox);
  })();

  window.onerror = function (msg, src, line, col, err) {
    console.error('[onerror]', msg, src, line, col, err);
    /* A JS error during load = fatal; show the error UI instead of leaving
       the user staring at a frozen progress bar or, worse, the play button. */
    if (!_runtimeReady) {
      _showError(msg ? String(msg) : 'A script error occurred while loading.');
    }
  };
  </script>

  <!-- Port specific: Module must be defined in its own <script> block,
       separate from the helpers above.  Emscripten's HTML minifier
       processes each <script> block independently; mixing the helper
       functions and the Module definition in one block caused the
       minifier to close the script tag early, leaving var Module = {}
       as raw HTML text (not executed JS) and thus Module["canvas"]
       undefined when GL.createContext ran.  Two blocks avoids this. -->
  <script>
  var Module = {
    canvas: (function () {
      var c = document.getElementById('canvas');
      if (c) {
        c.addEventListener('webglcontextlost', function (ev) {
          alert('WebGL context lost. Please reload the page.');
          ev.preventDefault();
        }, false);
      }
      return c;
    })(),

    print:    function () { console.log.apply(console, arguments); },
    printErr: function () { console.error.apply(console, arguments); },

    setStatus: function (text) {
      if (!text) return;
      var m = text.match(/\((\d+)\/(\d+)\)/);
      if (m) {
        var pct = Math.round(100 * parseInt(m[1]) / parseInt(m[2]));
        if (_progressBar) _progressBar.style.width = pct + '%';
        /* Record that progress is still happening; stall watchdog checks this. */
        _lastProgressTime = Date.now();
        _lastProgressPct  = pct;
      }
    },

    onAbort: function (what) {
      _showError('The game crashed while loading' + (what ? ': ' + what : '.'));
    },

    totalDependencies: 0,
  };

  (function () {
    /* Poll every 100ms: success path -- calledRun means the runtime started. */
    var _pollInterval = setInterval(function () {
      if (typeof Module !== 'undefined' && Module.calledRun) {
        clearInterval(_pollInterval);
        clearTimeout(_absoluteTimeout);
        clearInterval(_stallWatchdog);
        _showTapOverlay();
      }
    }, 100);

    /* Stall watchdog: every 2s, check whether progress has frozen AND the
       download is not yet complete.  If no progress tick in 20s and the bar
       is below 99%, the connection stalled -- show the error UI. */
    var _stallWatchdog = setInterval(function () {
      if (_runtimeReady || _loadFailed) {
        clearInterval(_stallWatchdog);
        return;
      }
      var stallMs = Date.now() - _lastProgressTime;
      if (stallMs > 20000 && _lastProgressPct < 99) {
        clearInterval(_stallWatchdog);
        clearTimeout(_absoluteTimeout);
        clearInterval(_pollInterval);
        console.warn('[shell] stall watchdog: no progress for ' + Math.round(stallMs / 1000) + 's');
        _showError('Loading timed out. Check your connection and reload.');
      }
    }, 2000);

    /* Absolute 45s fallback: by now the download should have finished.
       If calledRun was missed but the progress bar reached ~100% (download
       succeeded), show the tap overlay so the user can still start.
       If the download never completed, show the error overlay instead. */
    var _absoluteTimeout = setTimeout(function () {
      clearInterval(_pollInterval);
      clearInterval(_stallWatchdog);
      if (_runtimeReady || _loadFailed) return;
      if (_lastProgressPct >= 99) {
        console.warn('[shell] absolute fallback: download complete, calledRun not observed -- showing tap overlay');
        _showTapOverlay();
      } else {
        console.warn('[shell] absolute fallback: download incomplete after 45s');
        _showError('Loading timed out. Check your connection and reload.');
      }
    }, 45000);
  })();
  </script>

  <!-- Port specific: Emscripten injects the generated <script> tag here.
       This MUST be after the Module definition above. -->
  {{{ SCRIPT }}}
</body>
</html>
