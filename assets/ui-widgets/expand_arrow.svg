<svg xmlns="http://www.w3.org/2000/svg" width="32" height="38" viewBox="0 0 32 38">
  <!-- expand_arrow.tex - ComboBox CARET cell (right half of the split field).
       Rounded RIGHT, FLAT/open LEFT with a divider highlight so it reads as one
       continuous field split from the value cell (combo_bar.tex) to its left.
       ComboBox::Draw scales this texture to (GetWidth(), m_DrawHeight),
       i.e. the cell's WIDTH is always the texture's own native pixel width
       (drawn 1:1, unscaled) while its HEIGHT tracks kComboScaleY (38). The
       texture is authored at native height 38 (canvas 32x38) so that height
       scale is also 1:1, matching the width's 1:1 (uniform scale, no
       vertical stretch of the caret glyph; src/hud/ComboBox.cpp Draw). -->
  <defs>
    <linearGradient id="rim2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6a34"/>
      <stop offset="0.5" stop-color="#5c3a18"/>
      <stop offset="1" stop-color="#3a2410"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150f08"/>
      <stop offset="0.5" stop-color="#28190d"/>
      <stop offset="1" stop-color="#3a2712"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="0.5" stop-color="#f2c400"/>
      <stop offset="1" stop-color="#d98600"/>
    </linearGradient>
  </defs>
  <!-- wooden rim: flat left (x=0), rounded right -->
  <path d="M0 1.8 L23 1.8 Q30 1.8 30 10.1 L30 27.9 Q30 36.2 23 36.2 L0 36.2 Z"
        fill="url(#rim2)" stroke="#1a0f06" stroke-width="1.8"/>
  <!-- top brass highlight -->
  <rect x="2" y="3.6" width="24" height="1.9" fill="#e6b25a" fill-opacity="0.55"/>
  <!-- recessed inner field: flat left, rounded right -->
  <path d="M0 7.7 L21 7.7 Q25 7.7 25 12.5 L25 25.5 Q25 30.3 21 30.3 L0 30.3 Z"
        fill="url(#field2)" stroke="#0d0803" stroke-width="1.2"/>
  <!-- divider on the left edge (the split between value + caret) -->
  <rect x="0" y="6" width="1.6" height="26" fill="#1a0f06"/>
  <rect x="1.6" y="6" width="1.2" height="26" fill="#e6b25a" fill-opacity="0.45"/>
  <!-- gold down caret, centred in the visible field (art-bible chevron) -->
  <path d="M13 22.5 L7 15.9 L9.6 14.6 L13 19.2 L16.4 14.6 L19 15.9 Z"
        fill="url(#caret)" stroke="#5a3000" stroke-width="1" stroke-linejoin="round"/>
</svg>
