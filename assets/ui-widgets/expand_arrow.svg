<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
  <!-- expand_arrow.tex - ComboBox CARET cell (real binary texture, loaded by
       ComboBox @0x00168b3c alongside box.tex). Drawn immediately to the RIGHT
       of the box.tex value field. Same carved-wood construction + radii as
       box.svg / checked.svg (outer rim rx 5.5 stroke 1.5, tan bevel rx 4.5
       inset 1.5, groove rx 3.5 inset 4) but FLAT/open on the LEFT so it butts
       the value box seamlessly, ROUNDED on the right. A divider highlight marks
       the split. ComboBox::Draw scales this to (nativeWidth, barHeight); canvas
       is 32x40 so the caret glyph isn't vertically stretched at the 38-tall
       bar. Gold chevron centred in the field. -->
  <defs>
    <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5326"/>
      <stop offset="0.5" stop-color="#3c2510"/>
      <stop offset="1" stop-color="#241608"/>
    </linearGradient>
    <linearGradient id="groove2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#2a1a0d"/>
      <stop offset="1" stop-color="#3a2612"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="0.5" stop-color="#f2c400"/>
      <stop offset="1" stop-color="#d98600"/>
    </linearGradient>
  </defs>
  <!-- outer wood rim: flat left, rounded right (r 5.5) -->
  <path d="M0 2 L24.5 2 Q30 2 30 7.5 L30 32.5 Q30 38 24.5 38 L0 38 Z"
        fill="url(#wood2)" stroke="#1a0f06" stroke-width="1.5"/>
  <!-- tan bevel rim, inset 1.5, open left / rounded right -->
  <path d="M0 3.5 L24 3.5 Q28.5 3.5 28.5 8 L28.5 32 Q28.5 36.5 24 36.5 L0 36.5"
        fill="none" stroke="#a9743a" stroke-width="1.3" stroke-opacity="0.7"/>
  <!-- inner groove, inset 4, flat left / rounded right -->
  <path d="M0 6 L22.5 6 Q26 6 26 9.5 L26 30.5 Q26 34 22.5 34 L0 34 Z"
        fill="url(#groove2)" stroke="#0d0803" stroke-width="1.0"/>
  <!-- divider on the left edge (the split between value field + caret) -->
  <rect x="0" y="5" width="1.6" height="30" fill="#1a0f06"/>
  <rect x="1.6" y="5" width="1.2" height="30" fill="#a9743a" fill-opacity="0.45"/>
  <!-- gold down caret, centred in the groove -->
  <path d="M14 24.5 L8 17.9 L10.6 16.6 L14 21.2 L17.4 16.6 L20 17.9 Z"
        fill="url(#caret)" stroke="#5a3000" stroke-width="1" stroke-linejoin="round"/>
</svg>
