<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- expand_arrow.tex - ComboBox down chevron, single state. Gold, beveled.
       Chevron shape from the art bible polygon (downward). -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="0.5" stop-color="#f2c400"/>
      <stop offset="1" stop-color="#d98600"/>
    </linearGradient>
  </defs>
  <!-- polygon 50% 82%,8% 22%,26% 10%,50% 52%,74% 10%,92% 22% scaled to 32 -->
  <path d="M16 26.24 L2.56 7.04 L8.32 3.2 L16 16.64 L23.68 3.2 L29.44 7.04 Z"
        fill="url(#gold)" stroke="#5a3000" stroke-width="1.4"
        stroke-linejoin="round"/>
  <!-- top gloss on the two upper edges -->
  <path d="M8.32 3.2 L16 16.64 L23.68 3.2" fill="none" stroke="#fff4c0"
        stroke-width="1" stroke-opacity="0.6" stroke-linejoin="round"/>
</svg>
