<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <!-- checked.tex - filled carved-wood box + glossy lime checkmark.
       Same 32x32 box as unchecked.tex (matches the slider knob size);
       checkmark path from the art bible (M10 32 L24 46 L50 13 in a 0..60 box). -->
  <defs>
    <linearGradient id="woodc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5326"/>
      <stop offset="0.5" stop-color="#3c2510"/>
      <stop offset="1" stop-color="#241608"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e05a"/>
      <stop offset="0.5" stop-color="#8cc63f"/>
      <stop offset="1" stop-color="#34a832"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <!-- beveled wood rim -->
  <rect x="48" y="16" width="32" height="32" rx="5.5" ry="5.5" fill="url(#woodc)"
        stroke="#1a0f06" stroke-width="1.5"/>
  <rect x="49.5" y="17.5" width="29" height="29" rx="4.5" ry="4.5" fill="none"
        stroke="#a9743a" stroke-width="1.3" stroke-opacity="0.7"/>
  <!-- filled lime interior + gloss -->
  <rect x="52" y="20" width="24" height="24" rx="3.5" ry="3.5" fill="url(#lime)"
        stroke="#1f6f1c" stroke-width="1"/>
  <rect x="52" y="20" width="24" height="24" rx="3.5" ry="3.5" fill="url(#gloss)"/>
  <!-- checkmark: interior origin (52,20), scale 24/60=0.4 -->
  <path d="M56 32.8 L61.6 38.4 L72 25.2" fill="none" stroke="#ffffff"
        stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
