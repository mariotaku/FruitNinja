<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <!-- unchecked.tex - empty carved-wood tickbox, inset groove + beveled rim.
       55x55 box centred in the 128x64 quad (fits the 72x57 hit-rect). -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5326"/>
      <stop offset="0.5" stop-color="#3c2510"/>
      <stop offset="1" stop-color="#241608"/>
    </linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#3a2612"/>
    </linearGradient>
  </defs>
  <!-- outer beveled rim -->
  <rect x="36.5" y="4.5" width="55" height="55" rx="9" ry="9" fill="url(#wood)"
        stroke="#1a0f06" stroke-width="1.5"/>
  <!-- top-left highlight rim -->
  <rect x="38.5" y="6.5" width="51" height="51" rx="7.5" ry="7.5" fill="none"
        stroke="#a9743a" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- inset groove (recessed interior) -->
  <rect x="43" y="11" width="42" height="42" rx="5" ry="5" fill="url(#groove)"
        stroke="#0d0803" stroke-width="1"/>
</svg>
