<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- slider_will.tex - SliderControl THUMB. Round glossy orange bead/knob.
       Radial from the art bible: #ffc46a -> #ef8a12 60% -> #c96e08. -->
  <defs>
    <radialGradient id="bead" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffd89a"/>
      <stop offset="0.35" stop-color="#ffc46a"/>
      <stop offset="0.75" stop-color="#ef8a12"/>
      <stop offset="1" stop-color="#c96e08"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="14" fill="url(#bead)" stroke="#8a4a06" stroke-width="1.2"/>
  <!-- rim highlight -->
  <circle cx="16" cy="16" r="12.6" fill="none" stroke="#ffe6bf" stroke-width="1"
          stroke-opacity="0.5"/>
  <!-- specular glint -->
  <ellipse cx="12" cy="11" rx="5" ry="3.4" fill="#ffffff" fill-opacity="0.55"/>
</svg>
