<svg xmlns="http://www.w3.org/2000/svg" width="32" height="128" viewBox="0 0 32 128">
  <!-- vbar.tex - VerticalScroller TRACK. Dark recessed groove. -->
  <defs>
    <linearGradient id="vtrk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1c28"/>
      <stop offset="0.5" stop-color="#2a2a3c"/>
      <stop offset="1" stop-color="#1c1c28"/>
    </linearGradient>
  </defs>
  <rect x="9" y="2" width="14" height="124" rx="7" ry="7" fill="url(#vtrk)"
        stroke="#0c0c14" stroke-width="1"/>
  <!-- left inset shadow -->
  <rect x="10.5" y="4" width="4" height="120" rx="2" ry="2"
        fill="#000000" fill-opacity="0.35"/>
  <!-- right highlight lip -->
  <rect x="18.5" y="4" width="2" height="120" rx="1" ry="1"
        fill="#6a6a86" fill-opacity="0.4"/>
</svg>
