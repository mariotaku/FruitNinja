<svg xmlns="http://www.w3.org/2000/svg" width="120" height="38" viewBox="0 0 120 38">
  <!-- combo_bar.tex - ComboBox VALUE field (left half of the split field).
       Rounded LEFT, FLAT/open RIGHT so it butts seamlessly against the caret
       cell (expand_arrow.tex) drawn immediately to its right. ComboBox::Draw
       scales this texture to (m_DrawWidth, m_DrawHeight) = (kComboScaleX,
       kComboScaleY) = (120, 38) unconditionally (src/hud/ComboBox.cpp), so
       the texture is authored at that exact 120x38 aspect for a uniform
       (non-distorting) scale; see SettingsScreen.cpp kComboScaleX/Y note. -->
  <defs>
    <!-- wood rim + groove tones unified with checked/unchecked.svg -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5326"/>
      <stop offset="0.5" stop-color="#3c2510"/>
      <stop offset="1" stop-color="#241608"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#2a1a0d"/>
      <stop offset="1" stop-color="#3a2612"/>
    </linearGradient>
  </defs>
  <!-- wooden rim: rounded left (r=5.5, unified w/ checkbox), flat right (to x=120) -->
  <path d="M7.4 1.8 L120 1.8 L120 36.2 L7.4 36.2 Q1.9 36.2 1.9 30.7 L1.9 7.3 Q1.9 1.8 7.4 1.8 Z"
        fill="url(#rim)" stroke="#1a0f06" stroke-width="1.5"/>
  <!-- tan bevel rim, inset ~1.5 from the outer rim, rounded left / open right;
       matches unchecked.svg's #a9743a highlight rim (rx 4.5, stroke 1.3). -->
  <path d="M120 3.3 L7.9 3.3 Q3.4 3.3 3.4 7.8 L3.4 30.2 Q3.4 34.7 7.9 34.7 L120 34.7"
        fill="none" stroke="#a9743a" stroke-width="1.3" stroke-opacity="0.7"/>
  <!-- recessed inner groove: inset 4 from the rim path (r=3.5), same layering
       as unchecked.svg's 24x24 groove (outer -1.5- bevel -2.5- groove).
       Rounded left, flat right. -->
  <path d="M9.4 5.8 L120 5.8 L120 32.2 L9.4 32.2 Q5.9 32.2 5.9 28.7 L5.9 9.3 Q5.9 5.8 9.4 5.8 Z"
        fill="url(#field)" stroke="#0d0803" stroke-width="1.0"/>
</svg>
