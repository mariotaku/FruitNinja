<svg xmlns="http://www.w3.org/2000/svg" width="128" height="32" viewBox="0 0 128 32">
  <!-- combo_bar.tex - ComboBox VALUE field (left half of the split field).
       Rounded LEFT, FLAT/open RIGHT so it butts seamlessly against the caret
       cell (expand_arrow.tex) drawn immediately to its right. Rendered at the
       bar height (32) with no vertical stretch (texture is 128x32). -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6a34"/>
      <stop offset="0.5" stop-color="#5c3a18"/>
      <stop offset="1" stop-color="#3a2410"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150f08"/>
      <stop offset="0.5" stop-color="#28190d"/>
      <stop offset="1" stop-color="#3a2712"/>
    </linearGradient>
  </defs>
  <!-- wooden rim: rounded left, flat right (extends to x=128 to meet the caret) -->
  <path d="M9 1.5 L128 1.5 L128 30.5 L9 30.5 Q2 30.5 2 23.5 L2 8.5 Q2 1.5 9 1.5 Z"
        fill="url(#rim)" stroke="#1a0f06" stroke-width="1.5"/>
  <!-- top brass highlight -->
  <rect x="6" y="3" width="120" height="1.6" fill="#e6b25a" fill-opacity="0.55"/>
  <!-- recessed inner field: rounded left, flat right -->
  <path d="M11 6.5 L128 6.5 L128 25.5 L11 25.5 Q7 25.5 7 21.5 L7 10.5 Q7 6.5 11 6.5 Z"
        fill="url(#field)" stroke="#0d0803" stroke-width="1"/>
  <!-- inner top shadow so the field reads sunken -->
  <rect x="10" y="8" width="118" height="4" fill="#000000" fill-opacity="0.30"/>
  <!-- bottom inner highlight lip -->
  <rect x="10" y="22.5" width="118" height="1.6" fill="#7a5228" fill-opacity="0.5"/>
</svg>
